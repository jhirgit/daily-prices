name: Intraday Prices

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (e.g. AAPL,MSFT,NVDA); empty = watchlist"
        required: false
        type: string
  schedule:
    # every 20 min during US market hours (13:30-20:00 UTC, EDT); fetches the
    # watchlist (Finnhub-compatible symbols only) so intraday.json stays fresh
    # without anyone needing GitHub auth
    # off-peak minute marks: GitHub skips/delays busy slots like :00/:20/:40.
    # Ends at 19:43 UTC (3:43pm EDT) so the last snapshot freezes ~15 min
    # before the close - a stable pre-close mark until the EOD job publishes.
    # NOTE: this cron can go silent while the workflow still reports "active",
    # the run queue is empty, and workflow_dispatch works perfectly - GitHub
    # just stops creating scheduled runs. Delivery degrades progressively
    # before it stops: ~15 scheduled runs/day on 8/24-8/25, 6 on 8/26, 1 on
    # 8/27, then 12h+ of nothing.
    # Nothing repo-side fixes this. Disproven on 2026-08-27, in this order:
    #   - pushing a commit to main (data commit at 03:02 UTC, next four slots
    #     still missed) - so the old "any commit re-registers it" advice is wrong
    #   - gh workflow disable + enable
    #   - editing this file and pushing
    # After all three, the 15:03 and 15:23 slots still never fired. Context was
    # the 8/26-8/27 Actions incidents plus an unresolved GitHub billing
    # incident; cause was never confirmed as repo-side.
    # So: don't chase re-registration. Check githubstatus.com, and keep the
    # data fresh with `gh workflow run intraday-prices.yml` - dispatch has
    # never failed - until scheduled delivery resumes on GitHub's side.
    - cron: "3,33 13-19 * * 1-5"   # every 30 min; trimmed from every 20 on 2026-09-03 (Actions budget, jr-dash #15)

permissions:
  contents: write

concurrency:
  group: intraday-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch quotes
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TICKERS: ${{ inputs.tickers }}
        run: python scripts/fetch_intraday.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json data/history
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "intraday: ${{ inputs.tickers || 'watchlist' }} [skip ci]"
            git pull --rebase
            git push
          fi

  # A silent cron is the failure mode this repo actually has: nothing here
  # reported a broken run until someone noticed stale prices downstream.
  alert:
    needs: fetch
    if: failure()
    uses: ./.github/workflows/_alert-failure.yml
    with:
      workflow: Intraday Prices
    permissions:
      issues: write
