name: Tests

# Every test_*.py plus the two parity verifiers, on any push or PR that touches
# code, fixtures, the ticker lists or the workflows (review H3, 2026-09-26: ~3,400
# lines of tests existed and nothing ran them; a parity gate had been failing
# unnoticed). The bot's data commits touch only data/ and prices.db, so the path
# filter keeps this off the daily runs.
#
# Offline by construction: the test steps point every proxy variable at a closed
# local port, so a test that reaches for Yahoo or EDGAR fails here instead of
# passing on live data. (yfinance 1.x talks through libcurl, which honours these
# variables; urllib does too.)

on:
  push:
    paths:
      - "**.py"
      - "parity/**"
      - "data/fixtures/**"
      - "tickers.txt"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**.py"
      - "parity/**"
      - "data/fixtures/**"
      - "tickers.txt"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pip needs the network; the test steps below export the proxy block themselves.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (network blocked)
        run: |
          # GitHub rejects env keys that differ only by case (HTTP_PROXY vs http_proxy),
          # so the offline proxy block is exported here rather than in an env: map.
          export HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9
          export http_proxy=$HTTP_PROXY https_proxy=$HTTPS_PROXY all_proxy=$ALL_PROXY NO_PROXY= no_proxy=
          fail=0
          for f in test_*.py; do
            echo "::group::$f"
            python "$f" || { echo "::error file=$f::$f failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      # Frozen-fixture parity: options_flow on a synthetic chain fixture,
      # earnings_reactions on the committed prices.db (the #26 d-N convention).
      - name: Parity verifiers (network blocked)
        run: |
          # GitHub rejects env keys that differ only by case (HTTP_PROXY vs http_proxy),
          # so the offline proxy block is exported here rather than in an env: map.
          export HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9
          export http_proxy=$HTTP_PROXY https_proxy=$HTTPS_PROXY all_proxy=$ALL_PROXY NO_PROXY= no_proxy=
          python options_flow.py --verify
          python earnings_reactions.py --verify
