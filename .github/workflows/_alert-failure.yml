name: Alert on cron failure

# Opens (or updates) a GitHub issue when one of this repo's scheduled data jobs
# fails, and closes it again on the job's next successful run.
#
# WHY THIS EXISTS. All four crons here used to fail completely silently. A
# stopped cron surfaced only as "why are prices stale?" — a question someone had
# to think to ask, usually days later. The dashboard now shouts when the marks
# themselves go stale; this is the other half of that pair, so the repo says
# something the moment a run breaks rather than when a human notices the
# downstream symptom.
#
# WHY IT ALSO RESOLVES (review F8, 2026-09-26). Closing was manual, so issues
# #4/#5/#6 stayed open for weeks after every run went green again; a new failure
# then became a comment on a weeks-old issue instead of a new-issue notification,
# and the channel read "broken" permanently. Each caller now has a `resolve-*`
# job that calls this with mode: resolve when ITS OWN job succeeds; that closes
# the matching open issue with a link to the green run. No open issue, no-op.
#
# NOTE: this repository is PUBLIC. The issue body carries only the workflow name,
# the run URL, the trigger and a timestamp — never prices, tickers, or anything
# derived from the book.

on:
  workflow_call:
    inputs:
      workflow:
        description: "Human-readable name of the job (the issue title is 'cron failure: <workflow>')"
        required: true
        type: string
      mode:
        description: "open (a failure: open or comment) or resolve (a success: close the open issue)"
        required: false
        default: open
        type: string

jobs:
  issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          WORKFLOW_NAME: ${{ inputs.workflow }}
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const wf = process.env.WORKFLOW_NAME;
            const mode = process.env.MODE || 'open';
            const title = `cron failure: ${wf}`;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';

            // Dedupe by title so a persistent outage does not open one issue per
            // run — intraday alone fires three times an hour.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const hit = open.find((i) => i.title === title && !i.pull_request);

            if (mode === 'resolve') {
              if (!hit) {
                core.info(`no open "${title}" issue — nothing to resolve`);
                return;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: hit.number,
                body: `Resolved: **${wf}** succeeded.\n\n- run: ${runUrl}\n- when: ${when}\n- trigger: ${context.eventName}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: hit.number, state: 'closed', state_reason: 'completed',
              });
              core.notice(`closed issue #${hit.number} for ${wf}: the job succeeded`);
              return;
            }
            if (mode !== 'open') {
              core.setFailed(`unknown mode "${mode}" (expected open or resolve)`);
              return;
            }

            const body = [
              `**${wf}** failed.`,
              '',
              `- run: ${runUrl}`,
              `- when: ${when}`,
              `- trigger: ${context.eventName}`,
              '',
              'While this job is broken the payloads it publishes stop updating, so the',
              'dashboard keeps rendering older marks. This issue closes itself on the',
              "job's next successful run.",
            ].join('\n');

            // Best-effort label; issue creation must not depend on it existing.
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: 'cron-failure', color: 'd73a4a',
                description: 'A scheduled data job failed',
              });
            } catch (e) { /* already exists */ }

            if (!hit) {
              const made = await github.rest.issues.create({
                owner, repo, title, body, labels: ['cron-failure'],
              });
              core.notice(`opened issue #${made.data.number} for ${wf}`);
              return;
            }

            // Re-comment at most every 6 hours: enough to show the outage is
            // ongoing, quiet enough not to bury the issue in noise.
            const ageHours = (Date.now() - Date.parse(hit.updated_at)) / 3600000;
            if (ageHours < 6) {
              core.notice(`issue #${hit.number} already open (updated ${ageHours.toFixed(1)}h ago) — not commenting`);
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: hit.number, body: `Still failing.\n\n${body}`,
            });
            core.notice(`commented on issue #${hit.number} for ${wf}`);
