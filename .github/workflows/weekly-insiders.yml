name: Weekly Insiders

on:
  schedule:
    # Saturday 13:00 UTC — after the week's Form 4 flow has settled (filings
    # are due within 2 business days of the transaction; Friday's filings are
    # in by Friday evening ET). GitHub can delay scheduled runs by 10-30+ min.
    #
    # Kept, unlike intraday's and overnight's: nothing else pushes on a Saturday,
    # so a late delivery here overwrites nothing on-design, and the cron-dispatch
    # Worker's `0 13 * * SAT` slot plus this are simply two shots at the same
    # weekly refresh. The Worker is the scheduler; this is the true fallback.
    - cron: "0 13 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

# The only workflow here that had no concurrency group. It already runs twice
# every Saturday (Worker dispatch + this cron) and was green only because nothing
# else pushes that day; a weekday `workflow_dispatch` would race the :03/:33
# intraday pushes and fail with the same `! [rejected] main -> main (fetch first)`
# overnight.yml produced on 9/11. With the group it is safe to run on any day.
concurrency:
  group: weekly-insiders
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch insider transactions (EDGAR, incremental)
        run: python fetch_insiders.py
      - name: Commit updated insiders.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insiders.json data/insiders_12m.json
          if git diff --cached --quiet; then
            echo "No insider changes to commit."
          else
            git commit -m "insiders: weekly [skip ci]"
            # This step pushed with no pull at all until 2026-09-13: any commit
            # landing on main during the minutes-long EDGAR crawl rejected the
            # push and lost the week's Form 4 refresh until the next Saturday.
            # data/insiders*.json are whole-file SNAPSHOTS, regenerated from
            # scratch and never merged, so `-X theirs` (during a rebase: the
            # replayed commit, i.e. this run's newer snapshot) is the only
            # correct resolution. Jittered sleep so two racers do not re-collide.
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs && git push && exit 0
              sleep $((RANDOM % 20 + 5))
            done
            exit 1
          fi

  # A silent cron is the failure mode this repo actually has: nothing here
  # reported a broken run until someone noticed stale prices downstream.
  alert:
    needs: fetch
    # Conditional on ITS OWN job, not a bare failure() -- see intraday-prices.yml.
    if: failure() && needs.fetch.result == 'failure'
    uses: ./.github/workflows/_alert-failure.yml
    with:
      workflow: Weekly Insiders
    permissions:
      issues: write
